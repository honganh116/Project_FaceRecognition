<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Nhận diện Khuôn mặt AI</title>
    <!-- Tải font chữ hiện đại từ Google -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Cài đặt nền tổng thể */
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); /* Nền chuyển màu cực đẹp */
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        /* Khung màu trắng chứa toàn bộ nội dung */
        .main-card {
            background: white;
            padding: 30px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 25px;
        }

        /* Cài đặt khung hiển thị Camera */
        #video-container {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            width: 640px;
            height: 480px;
            margin: 0 auto;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            background-color: #000;
        }

        /* Lật ngược Camera lại cho giống gương soi */
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); 
        }

        /* Hiệu ứng Tia quét AI màu xanh lá */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(0, 255, 0, 0.6);
            box-shadow: 0 0 15px rgba(0, 255, 0, 1);
            animation: scan 2.5s linear infinite; /* Tia quét chạy lên xuống */
            z-index: 10;
        }

        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            50% { top: 100%; opacity: 1; }
            90% { opacity: 1; }
            100% { top: 0; opacity: 0; }
        }

        /* Thanh thông báo kết quả */
        #result-box {
            margin-top: 25px;
            padding: 18px 20px;
            font-size: 20px;
            font-weight: 600;
            border-radius: 12px;
            transition: all 0.3s ease;
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            color: #6c757d;
        }

        /* Đổi màu khi nhận diện thành công */
        .success {
            background-color: #d1e7dd !important;
            color: #0f5132 !important;
            border-color: #badbcc !important;
            box-shadow: 0 4px 12px rgba(25, 135, 84, 0.2);
        }

        /* Đổi màu khi có người lạ */
        .warning {
            background-color: #f8d7da !important;
            color: #842029 !important;
            border-color: #f5c2c7 !important;
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.2);
        }
    </style>
</head>
<body>

    <div class="main-card">
        <h1>🔍 Hệ thống Nhận diện Trí tuệ Nhân tạo</h1>
        
        <div id="video-container">
            <!-- Tia quét AI -->
            <div class="scan-line" id="scanner" style="display: none;"></div>
            <video id="webcam" autoplay playsinline></video>
        </div>

        <div id="result-box">Đang khởi động Camera...</div>
    </div>

    <!-- Trạm trung chuyển hình ảnh ẩn -->
    <canvas id="hidden-canvas" width="640" height="480" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('hidden-canvas');
        const ctx = canvas.getContext('2d');
        const resultBox = document.getElementById('result-box');
        const scanner = document.getElementById('scanner');

        // Bật Webcam
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                video.srcObject = stream;
                resultBox.innerHTML = "Camera đã sẵn sàng! Bắt đầu quét...";
                scanner.style.display = "block"; // Bật tia quét AI lên
                
                setInterval(captureAndRecognize, 1500); 
            })
            .catch(err => {
                console.error("Lỗi Webcam:", err);
                resultBox.innerHTML = "❌ Không thể mở Webcam. Vui lòng cấp quyền!";
                resultBox.className = "warning";
            });

        // Hàm chụp ảnh và gửi Backend
        function captureAndRecognize() {
            // Lật ngược lại ảnh trên canvas để gửi cho Backend chuẩn xác
            ctx.save();
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.restore();
            
            canvas.toBlob(blob => {
                const formData = new FormData();
                formData.append('file', blob, 'webcam_frame.jpg');

                fetch('http://localhost:8000/api/recognize', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.user) {
                        resultBox.innerHTML = `✅ Xin chào: ${data.user.name} (MSV: ${data.user.student_code})`;
                        resultBox.className = "success";
                    } else if (data.message && data.message.includes("lạ")) {
                        resultBox.innerHTML = `🚨 Phát hiện người lạ trong khung hình!`;
                        resultBox.className = "warning";
                    } else {
                        resultBox.innerHTML = "Đang tìm kiếm khuôn mặt...";
                        resultBox.className = "";
                    }
                })
                .catch(error => {
                    console.error('Lỗi API:', error);
                });
            }, 'image/jpeg');
        }
    </script>
</body>
</html>
