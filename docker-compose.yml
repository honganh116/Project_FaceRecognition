version: '3.8'

services:
  # --- DATABASE CHÍNH (POSTGRESQL) ---
  postgres:
    image: postgres:16
    container_name: facerecognition_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai_network

  # --- BỘ NHỚ ĐỆM & MESSAGE BROKER (REDIS) ---
  redis:
    image: redis:7
    container_name: facerecognition_redis
    restart: unless-stopped
    networks:
      - ai_network

  # --- VECTOR DATABASE CHO AI (QDRANT) ---
  qdrant:
    image: qdrant/qdrant:latest
    container_name: facerecognition_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ai_network

  # --- KHO LƯU TRỮ ẢNH KHUÔN MẶT (MINIO) ---
  minio:
    image: quay.io/minio/aistor/minio:latest
    container_name: facerecognition_minio
    restart: unless-stopped
    ports:
      - "9000:9000" # API định tuyến ảnh
      - "9001:9001" # Giao diện Console quản lý file
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - ai_network

  # --- HỆ THỐNG XỬ LÝ TRUNG TÂM (BACKEND API) ---
  backend:
    image: vuxover/project_facerecognition-backend:latest
    container_name: facerecognition_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DB_HOST=postgres
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
      - MINIO_HOST=minio
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
    depends_on:
      - postgres
      - redis
      - qdrant
      - minio
    networks:
      - ai_network

  # --- TIẾN TRÌNH XỬ LÝ NỀN / AI WORKER ---
  worker:
    image: vuxover/project_facerecognition-worker:latest
    container_name: facerecognition_worker
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DB_HOST=postgres
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
      - MINIO_HOST=minio
    depends_on:
      - backend
      - redis
    networks:
      - ai_network

  # --- GIAO DIỆN NGƯỜI DÙNG CHÍNH (FRONTEND) ---
  frontend:
    image: vuxover/project_facerecognition-frontend:latest
    container_name: facerecognition_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - ai_network

  # --- GIAO DIỆN QUẢN TRỊ (FRONTEND ADMIN) ---
  frontend_admin:
    image: vuxover/project_facerecognition-frontend_admin:latest
    container_name: facerecognition_frontend_admin
    restart: unless-stopped
    ports:
      - "3001:3000" # Đổi port ngoài thành 3001 để không trùng với frontend chính
    depends_on:
      - backend
    networks:
      - ai_network

  # --- GIAO DIỆN THIẾT BỊ ĐIỂM DANH (FRONTEND KIOSK) ---
  frontend_kiosk:
    image: vuxover/project_facerecognition-frontend_kiosk:latest
    container_name: facerecognition_frontend_kiosk
    restart: unless-stopped
    ports:
      - "3002:3000" # Đổi port ngoài thành 3002 để tránh xung đột
    depends_on:
      - backend
    networks:
      - ai_network

  # --- ĐIỀU PHỐI VÀ REVERSE PROXY (NGINX) ---
  nginx:
    image: nginx:latest
    container_name: facerecognition_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - frontend
      - frontend_admin
      - frontend_kiosk
    networks:
      - ai_network

volumes:
  postgres_data:
  qdrant_data:
  minio_data:

networks:
  ai_network:
    driver: bridge