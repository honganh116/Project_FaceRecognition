version: '3.8'

services:
  # 1. Khởi chạy AI Backend (Giữ nguyên)
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: face_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app  
    restart: always

  # 2. Giao diện Terminal Quét mặt (Cổng 3000)
  frontend_kiosk:
    build: 
      context: ./frontend_kiosk
      dockerfile: Dockerfile
    container_name: face_frontend_kiosk
    ports:
      - "3000:80" 
    depends_on:
      - backend
    restart: always

  # 3. Giao diện Quản trị Admin (Cổng 4000)
  frontend_admin:
    build: 
      context: ./frontend_admin
      dockerfile: Dockerfile
    container_name: face_frontend_admin
    ports:
      - "4000:80" # Chạy trên cổng 4000 an toàn, cách ly với cổng 3000
    depends_on:
      - backend
    restart: always