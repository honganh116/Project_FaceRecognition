
services:
  # 1. Khởi chạy AI Backend (Giữ nguyên)
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: face_backend
    expose:
      - "8000"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      # PostgreSQL
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=ai_project
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password

      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379

      # Qdrant
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333

      # MinIO
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=password123

      
    volumes:
      - ./backend:/app  
    
    depends_on:
      - postgres
      - redis
      - qdrant
      - minio

    restart: always

  # 2. Giao diện Terminal Quét mặt (Cổng 3000)
  frontend_kiosk:
    build: 
      context: ./frontend_kiosk
      dockerfile: Dockerfile
    container_name: face_frontend_kiosk
    expose:
      - "80"
    depends_on:
      - backend
    restart: always

  # 3. Giao diện Quản trị Admin (Cổng 4000)
  frontend_admin:
    build: 
      context: ./frontend_admin
      dockerfile: Dockerfile
    container_name: face_frontend_admin
    expose:
      - "80"
    depends_on:
      - backend
    restart: always
  # =========================
  # PostgreSQL
  # =========================
  postgres:
    image: postgres:16

    container_name: postgres

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai_project

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

    restart: always

  # =========================
  # Redis
  # =========================
  redis:
    image: redis:7

    container_name: redis

    ports:
      - "6379:6379"

    restart: always

  # =========================
  # Qdrant
  # =========================
  qdrant:
    image: qdrant/qdrant

    container_name: qdrant

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

    restart: always

  # =========================
  # MinIO
  # =========================
  minio:
    image: quay.io/minio/aistor/minio

    container_name: minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123

    # Enterprise License
      MINIO_LICENSE: minio/certs/minio.license

    ports:
    - "9000:9000"
    - "9001:9001"

    volumes:
    - minio_data:/data
    - ./licenses:/minio/certs

    restart: always
  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80" # Chỉ mở duy nhất cổng 80 ra máy thật
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend_kiosk
      - frontend_admin
      - backend
    restart: always
# =========================
# Volumes
# =========================
volumes:
  postgres_data:
  qdrant_data:
  minio_data: