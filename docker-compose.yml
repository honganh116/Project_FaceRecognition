services:
  # 1. Khởi chạy AI Backend
  backend:
    image: honganh116/faceid-backend:latest
    container_name: face_backend
    expose:
      - "8000"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=ai_project
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=password123
    volumes:
      - ./backend:/app  
    depends_on:
      - postgres
      - redis
      - qdrant
      - minio
    restart: always

  # 1.5. Khởi chạy AI Worker (Xử lý ngầm)
  worker:
    image: honganh116/faceid-worker:latest
    container_name: face_worker
    command: python worker.py 
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./backend:/app 
    depends_on:
      - redis
      - backend
    restart: always

  # 2. Giao diện Terminal Quét mặt
  frontend_kiosk:
    image: honganh116/faceid-kiosk:latest
    container_name: face_frontend_kiosk
    expose:
      - "80"
    depends_on:
      - backend
    restart: always

  # 3. Giao diện Quản trị Admin
  frontend_admin:
    image: honganh116/faceid-admin:latest
    container_name: face_frontend_admin
    expose:
      - "80"
    depends_on:
      - backend
    restart: always

  # =========================
  # SERVICES HẠ TẦNG (Giữ nguyên)
  # =========================
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai_project
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    restart: always

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  minio:
    image: quay.io/minio/aistor/minio
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
      MINIO_LICENSE: minio/certs/minio.license
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
      - ./licenses:/minio/certs
    restart: always

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80" 
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend_kiosk
      - frontend_admin
      - backend
    restart: always

volumes:
  postgres_data:
  qdrant_data:
  minio_data: