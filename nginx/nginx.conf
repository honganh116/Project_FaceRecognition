server {
    listen 80;
    server_name localhost;

    # Cho phép tải lên ảnh chất lượng cao (tối đa 15MB) không bị lỗi 413 Request Entity Too Large
    client_max_body_size 15M;

    # 1. Trỏ về Frontend Kiosk (Mặc định)
    location / {
        proxy_pass http://frontend_kiosk:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Trỏ về Frontend Admin
    # Lưu ý: React Admin được build với base URL là '/admin/'
    location /admin/ {
        proxy_pass http://frontend_admin:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Trỏ về Backend FastAPI (AI Engine)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
